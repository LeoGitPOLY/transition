<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">

  <!-- Dashed cluster circle -->
  <circle cx="64" cy="64" r="50" stroke-width="6" stroke-dasharray="12 12"></circle>

  <!-- Connections -->
  <g stroke-width="6">
    <line x1="64" y1="34" x2="42" y2="60"></line>
    <line x1="64" y1="34" x2="86" y2="60"></line>
    <line x1="42" y1="60" x2="64" y2="90"></line>
  </g>

  <!-- Nodes -->
  <g fill="black" stroke="none">
    <circle cx="64" cy="34" r="8"></circle>
    <circle cx="42" cy="60" r="8"></circle>
    <circle cx="86" cy="60" r="8"></circle>
    <circle cx="64" cy="90" r="8"></circle>
  </g>

</svg>